<!DOCTYPE html>
<html lang="en">

<head>
  <title>Our simple HTTP server</title>
  <link rel="stylesheet" type="text/css" href="/style.css">

  <script>
    const handleResponse = async (response, parseResponse = false) => {
      const content = document.getElementById('content');

      switch (response.status) {
        case 200:
          content.innerHTML = `<b>Success</b>`;
          break;
        case 201:
          content.innerHTML = `<b>Created</b>`;
          break;
        case 204:
          content.innerHTML = `<b>Updated (No Content)</b>`;
          break;
        case 400:
          content.innerHTML = `<b>Bad Request</b>`;
          break;
        case 404:
          content.innerHTML = `<b>Not Found</b>`;
          break;
      }

      if (parseResponse) {
        const obj = await response.json();

        if (obj.message) content.innerHTML += `<p>Message: ${obj.message}</p>`;

        if (obj.users) content.innerHTML += `<p>${JSON.stringify(obj.users)}</p>`;
      }
    };

    const handleAddUser = async (e) => {
      e.preventDefault();

      const form = e.currentTarget;
      const name = form.querySelector('#nameField').value;
      const age = form.querySelector('#ageField').value;

      const body = {
        name,
        age,
      };

      const res = await fetch(e.target.getAttribute('action'), {
        method: e.target.getAttribute('method'),
        headers: {
          'Content-Type': 'application/json',
          'Accept': 'application/json',
        },
        body: JSON.stringify(body),
      });

      await handleResponse(res);

      return false;
    };

    const handleGetUsers = async (e) => {
      e.preventDefault();

      const form = e.currentTarget;
      const pathname = form.querySelector('#urlField').value;
      const method = form.querySelector('#methodSelect').value;

      const res = await fetch(pathname, {
        method,
        headers: {
          'Accept': 'application/json'
        },
      });

      await handleResponse(res, method === 'get');

      return false;
    };

    const init = () => {
      const addUserForm = document.getElementById('nameForm');
      const getUsersForm = document.getElementById('userForm');

      addUserForm.addEventListener('submit', handleAddUser);
      getUsersForm.addEventListener('submit', handleGetUsers);
    }

    window.onload = init;
  </script>
</head>

<body>
  <section id="top">
    <h3>POST Status Code Tests</h3>
    <form id="nameForm" action="/addUser" method="post">
      <label for="name">Name: </label>
      <input id="nameField" type="text" name="name" />
      <label for="age">Age: </label>
      <input id="ageField" type="number" name="age" min="0" max="100" step="1" />
      <input type="submit" value="Add User" />
    </form>
    <form id="userForm" action="/getUsers" method="get">
      <select id='urlField'>
        <option value='/getUsers'>/getUsers</option>
        <option value='/notReal'>/notReal</option>
      </select>
      <select id="methodSelect">
        <option value="get">GET</option>
        <option value="head">HEAD</option>
      </select>
      <input type="submit" value="Get User" />
    </form>
  </section>
  <section id="content">
  </section>
</body>

</html>
